{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Монополии по отраслям</h1>
</div>

<form class="filters-form" id="filters-form">
    <div class="filter-group">
        <label>Тип</label>
        <select name="type" id="filter-type">
            <option value="">Все типы</option>
            <option value="natural">Естественные</option>
            <option value="artificial">Искусственные</option>
        </select>
    </div>

    <div class="filter-group">
        <label>Отрасль</label>
        <select name="industry" id="filter-industry">
            <option value="">Все отрасли</option>
        </select>
    </div>

    <div class="filter-group">
        <label>Поиск</label>
        <input type="text" name="q" id="filter-q" placeholder="Название или ИНН">
    </div>

    <button type="submit" class="btn-primary">Применить</button>
    <button type="button" class="btn-secondary" id="filters-reset">Сбросить</button>
</form>

<div id="monopolies-container">
    <p class="muted">Загрузка...</p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}
