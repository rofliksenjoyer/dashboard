{% extends "base.html" %}

{% block title %}{{ monopoly_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1 id="monopoly-name">{{ monopoly_name }}</h1>
    <a href="#" id="monopoly-website" class="website-link" target="_blank" style="display:none;"></a>
</div>

<p class="description" id="monopoly-description" style="display:none;"></p>

<div id="top-metrics"></div>

<h2>Динамика и сравнение</h2>
<div class="charts">
    <div id="chart-revenue" class="chart"></div>
    <div id="chart-ratios" class="chart"></div>
    <div id="chart-lerner" class="chart"></div>
    <div id="chart-hhi" class="chart"></div>
    <div id="chart-autonomy" class="chart"></div>
    <div id="chart-debt-load" class="chart"></div>
    <div id="chart-radar" class="chart"></div>
</div>

<div class="chart chart-wide" id="chart-market-share"></div>

<!-- Базовые показатели внизу — то, что я ошибочно убрал -->
<div id="basic-metrics"></div>

<h2>Судебные дела</h2>
<div id="court-cases-container">
    <p class="muted">Загрузка...</p>
</div>

<script>
    const MONOPOLY_ID = {{ monopoly_id }};
</script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% endblock %}
