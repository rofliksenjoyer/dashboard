{% extends "base.html" %}

{% block content %}
<div class="login-box">
    <h1>Вход</h1>
    <form method="POST" class="login-form">
        <label>Логин
            <input type="text" name="login" required>
        </label>
        <label>Пароль
            <input type="password" name="password" required>
        </label>
        <button type="submit">Войти</button>
    </form>
</div>
{% endblock %}
